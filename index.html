        document.addEventListener('DOMContentLoaded', () => { /*  */
            const directoryContainer = document.getElementById('directory-container');
            if (!directoryContainer) return;
            const studentsByBatch = students.reduce((acc, student) => {
                if (!acc[student.batch]) {
                    acc[student.batch] = [];
          
                } /* [cite: 79] */
                acc[student.batch].push(student);
                return acc;
            }, {});
            const sortedBatches = Object.keys(studentsByBatch).sort((a, b) => b - a);
            sortedBatches.forEach(batch => {
              
                const studentsInBatch = studentsByBatch[batch]; /* [cite: 80] */
                const studentCardsHTML = studentsInBatch.map(student => `
                    <div class="profile-card bg-white rounded-lg shadow-md overflow-hidden text-center transform hover:-translate-y-1 transition-transform duration-300">
                        <img src="${student.photoURL}" alt="Photo of ${student.name}" class="w-full h-40 object-cover" onerror="this.onerror=null;this.src='https://placehold.co/300x300/EFEFEF/333333?text=Image+Not+Found';">
            
                        <div class="p-4"> <h3 class="font-semibold text-slate-800">${student.name}</h3>
                            <p class="text-sm text-slate-500 mt-1">${student.place}</p>
                        </div>
  
                    </div> `).join('');
                const batchAccordionHTML = ` <div class="batch-accordion rounded-lg overflow-hidden shadow-sm border border-slate-200 bg-white">
                        <button class="accordion-button w-full flex justify-between items-center p-4 text-left hover:bg-slate-50 transition duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50">
                            <h2 class="text-xl font-semibold text-slate-900">Batch 
                            of ${batch}</h2> <svg class="accordion-icon w-6 h-6 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <div class="accordion-content bg-slate-50">
    
                            <div class="p-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"> ${studentCardsHTML}
                            </div>
          
                        </div> </div>
                `;
                directoryContainer.innerHTML += batchAccordionHTML; /* [cite: 87] */
            });
            directoryContainer.querySelectorAll('.accordion-button').forEach(button => {
                button.addEventListener('click', () => {
                    const accordionContent = button.nextElementSibling;
                    button.classList.toggle('active');
                    if (accordionContent.classList.contains('expanded')) {
          
                        accordionContent.classList.remove('expanded'); /* [cite: 88] */
                    } else {
                        accordionContent.classList.add('expanded');
                    }
                });
    
                }); /* [cite: 89] */

        body {

            background-color: #f8fafc;

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0, 1, 0, 1);
        }
        .accordion-content.expanded {
            max-height: 4000px;
            transition: max-height 1s ease-in-out;
        }
        .accordion-icon {
            transition: transform 0.3s ease-in-out;
        }
        .accordion-button.active .accordion-icon {
            transform: rotate(180deg);
        }
    </style>

        // --- END OF CHANGED SECTION ---

        document.addEventListener('DOMContentLoaded', () => {
            const directoryContainer = document.getElementById('directory-container');
            if (!directoryContainer) return;
            const studentsByBatch = students.reduce((acc, student) => {
                if (!acc[student.batch]) {
                    acc[student.batch] = [];
          
               }
                acc[student.batch].push(student);
                return acc;
            }, {});
            const sortedBatches = Object.keys(studentsByBatch).sort((a, b) => b - a);
            sortedBatches.forEach(batch => {
              
               const studentsInBatch = studentsByBatch[batch];
                const studentCardsHTML = studentsInBatch.map(student => `
                    <div class="profile-card bg-white rounded-lg shadow-md overflow-hidden text-center transform hover:-translate-y-1 transition-transform duration-300">
                        <img src="${student.photoURL}" alt="Photo of ${student.name}" class="w-full h-40 object-cover" onerror="this.onerror=null;this.src='httpsNext.js';this.src='https://placehold.co/300x300/EFEFEF/333333?text=Image+Not+Found';">

                            <h3 class="font-semibold text-slate-800">${student.name}</h3>
                            <p class="text-sm text-slate-500 mt-1">${student.place}</p>
                        </div>
  
                       </div>
                `).join('');
                const batchAccordionHTML = `
                    <div class="batch-accordion rounded-lg overflow-hidden shadow-sm border border-slate-200 bg-white">
                        <button class="accordion-button w-full flex justify-between items-center p-4 text-left hover:bg-slate-50 transition duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50">

of ${batch}</h2>

                        </button>

                                ${studentCardsHTML}
                            </div>
          
                       </div>
                    </div>
                `;
                directoryContainer.innerHTML += batchAccordionHTML;
            });
            directoryContainer.querySelectorAll('.accordion-button').forEach(button => {
                button.addEventListener('click', () => {
                    const accordionContent = button.nextElementSibling;
                    button.classList.toggle('active');
                    if (accordionContent.classList.contains('expanded')) {
          
                       accordionContent.classList.remove('expanded');
                    } else {
                        accordionContent.classList.add('expanded');
                    }
                });
    
                 });
